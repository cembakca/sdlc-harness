name: SDLC Office

# Ofis kurallari yalnizca birinin makinesinde degil, HER PR'da gecerli olsun.
#
# Burada MODEL CAGRISI YOK ve API anahtari gerekmiyor: yalnizca deterministik
# denetimler kosuyor. Kapi olcumleri (Jev) pahali degil ama PR'da kosturmak
# sir yonetimi gerektirir ve olcum zaten gelistirme sirasinda yapiliyor —
# burada olcumun SONUCU (karar defteri) denetleniyor.

# TASINABILIR: dal filtresi yok. Bu dosya hem bu repoda kosar hem de
# scripts/sdlc/init.sh ile baska bir repoya AYNEN kurulur. Tek kaynak:
# sdlc/ci.yml. Iki kopyanin ayrismasi selftest'te yakalanir.
on:
  pull_request:
  # main'de de kossun. PR'da yesil olan bir sey birlesmis halde kirmizi olabilir:
  # submodule isaretcisi geride kalir, CI kopyasi eskir, iki PR ayri ayri yesilken
  # birlestiginde bozulur. Ayrica harness kendi reposunda dogrudan main'e yazar;
  # yalnizca pull_request tetiklemesi orada CI'i HIC kosturmuyordu.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  office:
    name: Kadro, commit disiplini ve teslim hazirligi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # commit-lint tabana kadar gecmisi ister
          submodules: recursive   # harness submodule olarak bagliysa o da gelmeli
          # PR'i MERGE COMMIT'i degil, DALIN UCUNU checkout et. Varsayilan
          # davranis detached bir merge commit birakir; teslim kapisi o zaman
          # "hangi kod?" sorusunu cevaplayamaz ve bayatlik kontrolu sessizce
          # kapanir (dis denetimde bulundu 21 Eyl 2026).
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Harness nerede (ayni dosya iki duzende de kossun)
        # Yollari sabitlemek bu dosyanin iki kopyasini ayristirir.
        #   tuketen repo : proje ROOT'tur, harness sdlc-harness/ altindadir
        #   harness repo : harness ROOT'tur ve PROJE YOKTUR
        # if/fi, "&&" degil: GitHub bash'i -e ile kosar ve dizin yokken
        # basarisiz bir && listesi adimi dusurur.
        run: |
          SUB=""
          if [ -d sdlc-harness/gates ]; then SUB="sdlc-harness/"; fi
          echo "SDLC=$SUB" >> "$GITHUB_ENV"

      - name: Kadro kurallari (kodu yazan kendi kodunu denetlemesin)
        run: node ${SDLC}sdlc/roster.ts --check

      - name: Kalibrasyon dongusu saglam mi (modelsiz)
        # Eksik bir fixture OLCULMEYEN bir vakadir: kapi o durumda hic sinanmaz
        # ama rapor "hepsi tuttu" der. Model cagirmadan gorulur.
        run: node ${SDLC}gates/calibrate.ts --plan

      - name: Kalibrasyon kaydi taze mi
        # Kayit PROJEDE durur (sdlc/.last-calibration.json): olculen sey bu
        # projenin kapilaridir — genel vakalar + projenin kendi artifact'leri.
        run: |
          if [ -f sdlc/.last-calibration.json ]; then
            node -e '
              const r = JSON.parse(require("fs").readFileSync("sdlc/.last-calibration.json","utf8"));
              const days = Math.floor((Date.now() - new Date(r.at).getTime()) / 86400000);
              console.log(`son kalibrasyon: ${days} gun once · ${r.cases - r.wrong}/${r.cases} dogru · ${r.flapping} salinim`);
              if (r.wrong > 0) { console.error("KAPILAR AYIRT EDEMIYOR — duzeltilmeden PR birlestirilmemeli"); process.exit(1); }
              if (r.flapping > 0) { console.error("KAPILAR SALINIYOR — ayni girdide farkli karar veriyorlar"); process.exit(1); }
              // repeats<2 ise salinim OLCULMEMIS demektir; "flapping: 0" bos guvence.
              if (!(r.repeats >= 2)) { console.error(`kalibrasyon ${r.repeats}x kosmus — salinim olculmemis (en az 2 gerekir)`); process.exit(1); }
              if (days > 45) { console.error(`kalibrasyon ${days} gundur yenilenmemis`); process.exit(1); }
            '
          elif [ -f sdlc/project.json ]; then
            echo "kalibrasyon kaydi yok — make sdlc-calibrate"
            exit 1
          else
            echo "bu repoda proje yok — kayit beklenmiyor (dongu yukarida modelsiz denetlendi)"
          fi

      - name: Yapilandirma okunabilir mi (alan-alan)
        # Yapilandirma harness'in tek projeye ozgu girdisi; bozuk bir alan hatti
        # durdurmaz, SESSIZCE yanlis calistirir. Harness kendi reposunda proje
        # degildir, o yuzden orada atlanir.
        run: |
          if [ -f sdlc/project.json ]; then node ${SDLC}sdlc/validate.ts
          else echo "bu repoda proje yok — atlandi"; fi

      - name: Repoya sir girmis mi
        run: ${SDLC}scripts/sdlc/secret-scan.sh

      - name: Durum makinesi saglam mi (olu faz yok)
        run: node ${SDLC}gates/chain.ts

      - name: Orkestrasyon kuru kosumda yuruyor mu
        run: node ${SDLC}scripts/sdlc/workflow-dryrun.mjs

      - name: Durdurucular gercekten durduruyor mu (regresyon)
        # Selftest bir PROJE uzerinde kosar; harness kendi reposunda proje
        # degildir ve yapilandirmaya bakan kontroller "gecersiz JSON" diye
        # duser (olculdu 22 Eyl 2026: 78'den 75). O zaman ornek proje uretilir.
        #
        # SDLC_PROJECT_ROOT YALNIZCA BU ADIMA verilir. Ise yarar gorunup
        # tehlikeli olan sey global yapmakti: sir taramasi o zaman harness'i
        # degil bos ornek projeyi tarar ve "temiz" der — agents.env'i kacirmis
        # olan hatanin ta kendisi.
        run: |
          if [ -f sdlc/project.json ]; then
            ${SDLC}scripts/sdlc/selftest.sh
          else
            # Harness reposu: suit UC proje bicimi uzerinde kosar. Tek bicim,
            # "tasinabilir" iddiasini kanitlamiyordu (olculdu 22 Eyl 2026 —
            # cok yiginli ve ic ice duzenler farkli kod yollarini calistirir).
            for shape in tek coklu monorepo; do
              echo "── bicim: $shape"
              SDLC_PROJECT_ROOT="$(${SDLC}fixtures/make-project.sh "$shape")" \
                ${SDLC}scripts/sdlc/selftest.sh
            done
          fi

      - name: Tuketen repoda komutlar ayakta mi (gercek submodule)
        # Harness kendi reposunda "iki kok ayni dizin" oldugu icin kok karismasi
        # gorunmez; bu adim GERCEK bir submodule kurup komutlari kosturur.
        # Tuketen repoda gereksiz: orada zaten iki kok ayri.
        if: ${{ !hashFiles('sdlc/project.json') }}
        run: fixtures/consumer-smoke.sh .

      - name: Ticket dali mi — degilse ISTISNA, ve istisna GORUNUR olur
        id: ticket
        # BIR BILETI BILET YAPAN SEY BELGELERIDIR, dal adi degil.
        # Ilk gercek CI kosusunda olculdu (21 Eyl 2026): bu harness'in KENDI
        # PR'i "sdlc/office-ci" dalindan geldigi icin "office-ci" adinda bir
        # bilet sanildi ve olmayan artifact'leri arandi.
        #
        # ISTISNA POLITIKASI (dis denetim, 22 Eyl 2026). Bilet belgesi olmayan
        # bir degisiklikte commit disiplini ve teslim hazirligi ATLANIR. Bu
        # bilincli bir istisnadir — her yazim hatasi duzeltmesi spec/plan/UAT
        # uretmek zorunda degil. Ama istisna SESSIZ olmamali:
        #   1. is ozetine acikca yazilir ("ofis disinda"),
        #   2. proje isterse istisnayi KAPATABILIR:
        #      sdlc/project.json -> "ci": { "requireTicket": true }
        #      o zaman bilet belgesi olmayan PR duser.
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          TICKET=""
          WHY=""
          case "$BRANCH" in
            sdlc/*)
              T="${BRANCH#sdlc/}"
              if [ -d "docs/sdlc/$T" ]; then TICKET="$T"
              else WHY="dal adi sdlc/ ile basliyor ama docs/sdlc/$T yok"; fi
              ;;
            *) WHY="dal adi sdlc/<TICKET> degil ($BRANCH)" ;;
          esac
          echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"

          if [ -n "$TICKET" ]; then
            echo "bilet: $TICKET — commit disiplini ve teslim kapisi kosacak" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          REQUIRE=false
          if [ -f sdlc/project.json ]; then
            REQUIRE="$(node -e 'try{const p=require("./sdlc/project.json");console.log(p.ci?.requireTicket===true)}catch{console.log(false)}')"
          fi
          {
            echo "### Bu degisiklik OFIS DISINDA"
            echo ""
            echo "- sebep: $WHY"
            echo "- atlanan: commit disiplini, teslim hazirligi, karar defteri ozeti"
            echo "- kosan: kadro, yapilandirma, sir taramasi, durum makinesi, kuru kosum, selftest, kalibrasyon"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "OFIS DISINDA: $WHY"

          if [ "$REQUIRE" = "true" ]; then
            echo "sdlc/project.json -> ci.requireTicket true: bu repoda istisna YOK" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Bu repo her degisiklikten bilet belgesi istiyor (ci.requireTicket). $WHY"
            exit 1
          fi

      - name: Commit disiplini (bir plan gorevi = bir commit)
        if: steps.ticket.outputs.ticket != ''
        # "|| true" KALDIRILDI. Kirilamayan kural, kural degildir: linter dogru
        # olcuyordu ama sonucu hicbir seyi degistirmiyordu (olculdu 21 Eyl 2026 —
        # F4-1'de 10 plan gorevi vardi, 0 gorev commit'i, CI yesil).
        run: ${SDLC}scripts/sdlc/commit-lint.sh "${{ steps.ticket.outputs.ticket }}"

      - name: Teslim hazirligi (modelsiz — kayitlari okur)
        if: steps.ticket.outputs.ticket != ''
        # Kapi hangi koda baktigini BILMELI: worktree CI'da yok, bu yuzden
        # PR'in head SHA'si acikca gecilir.
        env:
          SDLC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node ${SDLC}gates/readiness.ts "${{ steps.ticket.outputs.ticket }}"

      - name: Karar defteri ozeti
        if: steps.ticket.outputs.ticket != ''
        run: node ${SDLC}gates/history.ts "${{ steps.ticket.outputs.ticket }}" >> "$GITHUB_STEP_SUMMARY"
